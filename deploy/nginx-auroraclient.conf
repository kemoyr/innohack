# Volunteer+ dashboard vhost for auroraclient.fun.
# Replaces the previous store-website vhost (backed up before install).
# api.auroraclient.fun / aurora-core is untouched by this file.

server {
    listen 80;
    listen [::]:80;
    server_name auroraclient.fun www.auroraclient.fun;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://auroraclient.fun$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.auroraclient.fun;
    ssl_certificate     /etc/letsencrypt/live/auroraclient.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auroraclient.fun/privkey.pem;
    return 301 https://auroraclient.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auroraclient.fun;

    ssl_certificate     /etc/letsencrypt/live/auroraclient.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auroraclient.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/beeline;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Verification photo uploads.
    client_max_body_size 15m;

    # Hashed assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    # SPA fallback: every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
